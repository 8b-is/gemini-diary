name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  constellation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/diary-target
      DIARY_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust checks
        run: |
          cargo fmt --check
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: publisher regression checks
        run: python3 -m unittest discover -s scripts -v

      - name: build the diary
        run: cargo build --release

      - name: install browser test runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/diary-browser"
          "$RUNNER_TEMP/diary-browser/bin/pip" install playwright==1.64.1
          "$RUNNER_TEMP/diary-browser/bin/python" -m playwright install --with-deps chromium

      - name: isolated HTTP, restart, constellation and browser contracts
        run: '"$RUNNER_TEMP/diary-browser/bin/python" e2e/diary.py --browser'
